<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dex</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dex-token" content="__DEX_TOKEN__">
<style>
:root{--bg:#09090B;--side:#0C0C0F;--card:#111114;--card2:#17171B;--line:#1F1F25;--line2:#2A2A31;--fg:#EDEDF0;--mut:#9C9CA7;--dim:#8A8A95;--faint:#6E6E78;
--acc:#C6F432;--accText:#D4F56A;--accBg:#1B2410;--ok:#34D399;--okText:#6EE7B7;--okBg:#13241C;--warn:#FBBF24;--warnText:#FCD34D;--warnBg:#2A2210;--bad:#F87171;--badText:#FCA5A5;--badBg:#2A1416;--info:#60A5FA;--infoText:#93C5FD;--infoBg:#121C2B;
--sans:"Geist","Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accText);text-decoration:none}a:hover{color:#E6FA9E}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono)}.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh;flex-wrap:wrap}
.side{flex:0 0 232px;background:var(--side);border-right:1px solid #1C1C22;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#0A0A0A;font-weight:700;display:flex;align-items:center;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}.nav a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--mut)}
.nav a.on{background:#18181D;color:var(--fg);font-weight:500}.nav a:hover{color:var(--fg)}.nav svg{flex:0 0 auto}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--acc);color:#0A0A0A}
.health{margin-top:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.health .row{display:flex;justify-content:space-between;color:var(--mut)}.health .row span:last-child{color:var(--fg)}
.main{flex:1 1 640px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid #1C1C22;position:sticky;top:0;background:rgba(9,9,11,.92);backdrop-filter:blur(8px);z-index:5}
.top h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live{animation:pulse 1.8s infinite}
@media (prefers-reduced-motion:reduce){.live,.shimmer{animation:none!important}}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:500}
.btn:hover{border-color:#3A3A43}.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:8px}.btn.ghost{background:transparent}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#0A0A0A;font-weight:600}.btn.primary:hover{background:#D4F56A}
.btn.danger{border-color:#4A2326;background:#1E1214;color:var(--badText)}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--accBg);color:var(--accText)}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--mut)}
.wrap{padding:24px 32px 64px;display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.banner{border-radius:12px;padding:12px 16px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warnBg);border-color:#4A3B12;color:var(--warnText)}.banner.bad{background:var(--badBg);border-color:#4A2326;color:var(--badText)}
.card{border-radius:14px;border:1px solid var(--line);background:var(--card)}
.cmd{border-radius:16px;border:1px solid var(--line2);background:var(--card);padding:6px}
.cmd .in{display:flex;align-items:center;gap:12px;padding:6px 12px}
.cmd input{flex:1;min-width:0;min-height:44px;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px}
.cmd input::placeholder{color:#7C7C87}
.pv{margin:4px;border-radius:12px;background:var(--card2);border:1px solid #22222A;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.pv .meta{flex:999 1 360px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tag{padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.side{flex-basis:100%}.health{display:none}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:2px}.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.colmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px}.colside{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px}
.h2{display:flex;align-items:center;gap:10px}.h2 h2{margin:0;font-size:14px;font-weight:600}.h2 .r{margin-left:auto}
.job{border-radius:16px;border:1px solid var(--line2);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:16px}
.jobhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px}.steps .bar{height:4px;border-radius:99px}
.now{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--side);border:1px solid #1C1C22;font-family:var(--mono);font-size:12px}
.now span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes shim{0%{background-position:-200px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,var(--fg) 0%,var(--fg) 40%,#8A8A95 50%,var(--fg) 60%,var(--fg) 100%);background-size:600px 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
.agents{display:flex;gap:6px;flex-wrap:wrap}.ag{padding:3px 9px;border-radius:99px;font-size:12px}
.meter{height:6px;border-radius:99px;background:#23232A;overflow:hidden}.meter div{height:6px;border-radius:99px}
.queued{border-radius:14px;border:1px dashed var(--line2);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.list .row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid #1A1A20;flex-wrap:wrap}.list .row:first-child{border-top:0}
.ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.feed{padding:6px 16px}.feed .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1A1A20;font-size:13px}.feed .it:last-child{border-bottom:0}
.empty{padding:18px;color:var(--dim);font-size:13px;text-align:center}
.jobs{display:flex;flex-wrap:wrap;min-height:calc(100vh - 67px)}
.jlist{flex:0 0 340px;border-right:1px solid #1C1C22;display:flex;flex-direction:column}
@media (max-width:1100px){.jlist{flex-basis:100%;border-right:0;border-bottom:1px solid #1C1C22;max-height:360px;overflow:auto}}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--card);border:1px solid var(--line)}.seg button{flex:1;min-height:32px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-size:13px;padding:0 12px}
.seg button[aria-selected="true"]{background:#23232A;color:var(--fg)}
.jl{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #16161B;border-left:2px solid transparent;color:var(--fg)}.jl:hover{background:#0F0F12;color:var(--fg)}.jl.on{background:var(--card);border-left-color:var(--acc)}
.jl .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jdetail{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.jdh{padding:20px 28px;border-bottom:1px solid #1C1C22;display:flex;flex-direction:column;gap:14px}
.stat{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.stat .v{font-family:var(--mono);font-size:17px}
.tabs{display:flex;gap:18px;border-bottom:1px solid #1C1C22}.tabs button{min-height:40px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mut);font-weight:500}
.tabs button[aria-selected="true"]{border-bottom-color:var(--acc);color:var(--fg)}
.logbox{border-radius:12px;border:1px solid var(--line);background:var(--side);padding:14px;font-family:var(--mono);font-size:12px;line-height:1.8;color:#B4B4BE;overflow-x:auto}
.logbox .l{display:flex;gap:14px;white-space:nowrap}.logbox .tool{color:var(--accText);min-width:48px}.logbox .sub{color:var(--faint)}
.tl .s{display:flex;gap:12px}.tl .rail{display:flex;flex-direction:column;align-items:center}.tl .c{width:18px;height:18px;border-radius:99px;border:2px solid;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#0A0A0A}
.tl .ln{flex:1;width:2px;min-height:16px;background:#23232A}
.sec{display:flex;flex-direction:column;gap:12px}.sec h2{margin:0;font-size:15px;font-weight:600}.sec p{margin:0;color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media (max-width:800px){.grid2{grid-template-columns:1fr}}
.swc{padding:16px;display:flex;gap:14px;align-items:flex-start}
.sw{flex:0 0 auto;width:44px;height:26px;border-radius:99px;border:0;padding:3px;display:flex;background:var(--line2)}.sw span{width:20px;height:20px;border-radius:99px;background:var(--mut)}
.sw[aria-checked="true"]{background:var(--acc);justify-content:flex-end}.sw[aria-checked="true"] span{background:#0A0A0A}
.acct{text-align:left;border-radius:14px;border:1.5px solid #23232A;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:6px}
.acct[aria-checked="true"]{border-color:var(--acc);background:#141A0B}
.radio{width:16px;height:16px;border-radius:99px;border:2px solid #3A3A43}.acct[aria-checked="true"] .radio{border-color:var(--acc);background:var(--acc)}
.lim{display:flex;align-items:center;gap:18px;padding:14px 18px;border-top:1px solid #1A1A20;flex-wrap:wrap}.lim:first-child{border-top:0}
.lim input{width:140px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font:inherit;font-family:var(--mono)}
.savebar{position:sticky;bottom:20px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:14px;background:#18181D;border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.55);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:12px;background:var(--fg);color:#0A0A0A;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:13px;max-width:92vw;z-index:20}
.toast button{min-height:32px;padding:0 12px;border-radius:8px;border:0;background:#0A0A0A;color:var(--fg);font-weight:600}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">D</div><div style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:600">Dex</span><span class="dim small">review bot</span></div></div>
  <nav class="nav" aria-label="Main">
    <a href="#overview" data-v="overview"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
    <a href="#jobs" data-v="jobs"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Jobs<span class="badge" id="nav-live" hidden></span></a>
    <a href="#settings" data-v="settings"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
  </nav>
  <div class="health" id="health"></div>
</aside>

<div class="main">
  <header class="top">
    <h1 id="title">Overview</h1>
    <span class="pill" id="status">…</span>
    <div class="acts">
      <button class="btn" id="pause" type="button"></button>
      <button class="btn" id="restart" type="button"></button>
    </div>
  </header>

  <div id="v-overview" class="wrap">
    <div id="banners"></div>
    <section class="cmd" aria-label="Run a review">
      <div class="in">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6F432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/></svg>
        <label for="pr" class="sr">Pull request link</label>
        <input id="pr" type="url" autocomplete="off" spellcheck="false" placeholder="Paste a pull request link to review…">
        <kbd>/</kbd>
      </div>
      <div id="pv" hidden></div>
    </section>
    <div class="kpis" id="kpis"></div>
    <div class="cols">
      <div class="colmain">
        <div class="h2"><h2>Live</h2><span class="dim small" id="live-sub"></span></div>
        <div id="live"></div>
        <div class="h2" style="margin-top:8px"><h2>Recent</h2><a class="r small" href="#jobs">All jobs →</a></div>
        <div class="card list" id="recent"></div>
      </div>
      <aside class="colside" aria-label="Activity">
        <div class="h2"><h2>Activity</h2><span class="dim small">Slack, reviews and this page</span></div>
        <div class="card feed" id="feed"></div>
      </aside>
    </div>
  </div>

  <div id="v-jobs" class="jobs" hidden>
    <section class="jlist" aria-label="Jobs">
      <div style="padding:16px;border-bottom:1px solid #1C1C22">
        <div class="seg" role="tablist" aria-label="Filter" id="jfilter">
          <button role="tab" data-f="all">All</button><button role="tab" data-f="live">Live</button><button role="tab" data-f="failed">Failed</button><button role="tab" data-f="mine">Mine</button>
        </div>
      </div>
      <div id="jl"></div>
    </section>
    <section class="jdetail" id="jd" aria-label="Job"></section>
  </div>

  <div id="v-settings" class="wrap" hidden></div>
</div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toast-t"></span><button id="toast-u" type="button" hidden>Undo</button></div>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="dex-token"]').content;
const $ = id => document.getElementById(id);
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  for (const k in a || {}) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, a, ...kids) { const e = document.createElementNS(NS, tag); for (const k in a || {}) e.setAttribute(k, a[k]); kids.forEach(c => e.append(c)); return e; }
const fill = (id, ...kids) => { const el = typeof id === "string" ? $(id) : id; el.replaceChildren(...kids.flat().filter(x => x != null && x !== false)); return el; };

const human = n => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n)); };
const usd = v => "$" + (+v || 0).toFixed(2);
const dur = s => { s = Math.max(0, Math.round(s || 0)); const p = n => String(n).padStart(2, "0"); return s >= 3600 ? Math.floor(s / 3600) + "h " + p(Math.floor(s % 3600 / 60)) + "m" : s >= 60 ? Math.floor(s / 60) + "m " + p(s % 60) + "s" : s + "s"; };
const clock = t => t ? new Date(t * 1000).toTimeString().slice(0, 5) : "—";
const tokSum = t => t ? (t.fresh || 0) + (t.cache_read || 0) + (t.output || 0) : 0;
const PR = /^https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/pull\/(\d+)/;

let D = null, view = "overview", sel = null, jfilter = "all", tab = "calls", force = false;
let pending = null, toastTimer = null, draft = null, checks = {}, pv = { url: "", data: null, err: "", busy: false }, kind = "review";

const nameOf = id => (D && D.names && D.names[id]) || id || "—";
const prShort = url => { const m = PR.exec(url || ""); return m ? m[1].split("/")[1] + " #" + m[2] : (url || ""); };
const jobTitle = j => j.kind === "question" ? "Question from " + nameOf(j.user) : prShort(j.url || j.what);
const rt = () => (D && D.runtime) || { running: [], recent: [], policy: null };
const allJobs = () => [...(rt().running || []), ...(rt().recent || [])];
const ready = () => D && D.controls_ready;

async function api(body) {
  try {
    const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Dex-Token": TOKEN }, body: JSON.stringify(body) });
    let j; try { j = await r.json(); } catch (e) { j = { ok: false, message: "HTTP " + r.status }; }
    if (r.status === 202 && j.id) j = await waitResult(j.id) || j;
    return j;
  } catch (e) { return { ok: false, message: "The page cannot reach its server." }; }
}
async function waitResult(id) {
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try { const j = await (await fetch("/api/result?id=" + encodeURIComponent(id), { headers: { "X-Dex-Token": TOKEN } })).json(); if (j && j.ok !== null && j.ok !== undefined) return j; } catch (e) {}
  }
  return null;
}
function toast(text, undo, ms) {
  clearTimeout(toastTimer); $("toast-t").textContent = text; $("toast").hidden = false;
  const u = $("toast-u"); u.hidden = !undo; u.onclick = () => { undo && undo(); $("toast").hidden = true; };
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, ms || 4000);
}

// ---- actions ----
function stopJob(j) {
  if (!ready()) return toast("Stop needs Dex restarted once with this version.");
  if (pending) clearTimeout(pending.timer);
  const label = jobTitle(j);
  pending = { id: j.id, timer: setTimeout(async () => { pending = null; render(); const r = await api({ action: "stop", job: j.id }); toast(r.message || (r.ok ? "Stopped." : "Could not stop it.")); tick(); }, 5000) };
  toast((j.status === "queued" ? "Cancelling " : "Stopping ") + label + " in 5s", () => { clearTimeout(pending.timer); pending = null; render(); }, 5200);
  render();
}
async function runReview(url, f) {
  if (!ready()) return toast("Run needs Dex running with this version.");
  toast("Starting a review of " + prShort(url) + "…", null, 20000);
  const r = await api({ action: "run", url, force: !!f });
  toast(r.message || (r.ok ? "Queued." : "Dex did not start it."), null, 6000);
  if (r.ok) { $("pr").value = ""; pv = { url: "", data: null, err: "", busy: false }; renderPreview(); }
  tick();
}
function restart() {
  const c = D && D.runtime && D.runtime.control;
  if (c && c.restart_pending) return api({ action: "cancel_restart" }).then(r => { toast(r.message); tick(); });
  if (!ready()) return toast("Restart needs Dex running with this version.");
